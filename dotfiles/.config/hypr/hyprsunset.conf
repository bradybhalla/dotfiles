profile {
    time = 7:00
    # 6000 is hyprsunset's default temp. don't use identity = true here: it
    # doesn't reset the reported temperature, so waybar's night-mode.sh would
    # keep seeing the night temp and show the wrong icon
    temperature = 6000
}

profile {
    time = 19:00
    temperature = 3600
}
